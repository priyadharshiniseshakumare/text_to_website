<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Website Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AI Website Generator</h1>

        <p class="subtitle">
            Describe your website and let AI build it for you.
        </p>

        <textarea
            id="prompt"
            placeholder="Example: Create a modern bakery website with Home, Products, About and Contact pages..."
        ></textarea>

        <button>
            Generate Website
        </button>

        <div id="status"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
